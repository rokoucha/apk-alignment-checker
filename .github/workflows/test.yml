name: test

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false

      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...

  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # fixtureは16KBにアラインされていないので、検査は失敗するはず。
      - id: check
        uses: ./
        continue-on-error: true
        with:
          paths: internal/checker/testdata/*.so

      - name: Verify the action failed with a report
        env:
          OUTCOME: ${{ steps.check.outcome }}
          REPORT: ${{ steps.check.outputs.report }}
        run: |
          test "$OUTCOME" = failure
          grep -F 'libdatastore_shared_counter.so' <<<"$REPORT"
